<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kopro — Souscription</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<nav class="nav">
  <a class="nav-logo" href="index.html">
      <img src="assets/images/logo2.png" alt="Kopro Logo" class="nav-logo-img">
  </a>
  <div class="nav-links">
    <a class="nav-link" href="index.html">Accueil</a>
    <a class="nav-link" href="projects.html">Projets</a>
    <a class="nav-link" href="#">Comment ça marche</a>
    <a class="nav-link" href="#">À propos</a>
  </div>
  <div class="nav-actions">
    <a class="btn-secondary btn-sm" href="dashboard.html">Mon espace</a>
    <a class="btn-primary btn-sm" href="subscribe.html">Investir <i class="fa-solid fa-arrow-right"></i></a>
  </div>
</nav>

<div class="sub-wrap">
  <a class="btn-back" href="detail.html">
    <i class="fa-solid fa-arrow-left"></i> Retour au projet
  </a>

  <!-- Barre d'étapes -->
  <div class="sub-steps">
    <div class="sub-step-item">
      <div class="sub-step-col">
        <div class="sub-step-dot sub-step-dot--active">1</div>
        <div class="sub-step-lbl sub-step-lbl--active">Compte</div>
      </div>
      <div class="sub-connector"></div>
    </div>
    <div class="sub-step-item">
      <div class="sub-step-col">
        <div class="sub-step-dot">2</div>
        <div class="sub-step-lbl">KYC</div>
      </div>
      <div class="sub-connector"></div>
    </div>
    <div class="sub-step-item">
      <div class="sub-step-col">
        <div class="sub-step-dot">3</div>
        <div class="sub-step-lbl">Projet</div>
      </div>
      <div class="sub-connector"></div>
    </div>
    <div class="sub-step-item">
      <div class="sub-step-col">
        <div class="sub-step-dot">4</div>
        <div class="sub-step-lbl">Paiement</div>
      </div>
      <div class="sub-connector"></div>
    </div>
    <div class="sub-step-item">
      <div class="sub-step-col">
        <div class="sub-step-dot">5</div>
        <div class="sub-step-lbl">Signature</div>
      </div>
      <div class="sub-connector"></div>
    </div>
    <div class="sub-step-item">
      <div class="sub-step-col">
        <div class="sub-step-dot">6</div>
        <div class="sub-step-lbl">Confirmation</div>
      </div>
    </div>
  </div>

  <!-- Étape 1 : Compte -->
  <div class="sub-card">
    <h2 class="sub-card-title">Créez votre compte</h2>
    <p class="sub-card-sub">
      Inscription gratuite en 2 minutes.
      Déjà un compte ? <span class="link-orange">Se connecter</span>
    </p>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Prénom</label>
        <input class="form-input" placeholder="Amadou" />
      </div>
      <div class="form-group">
        <label class="form-label">Nom</label>
        <input class="form-input" placeholder="Koné" />
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Email</label>
      <input class="form-input" type="email" placeholder="amadou@email.com" />
    </div>
    <div class="form-group">
      <label class="form-label">Téléphone (WhatsApp)</label>
      <input class="form-input" placeholder="+225 07 00 00 00 00" />
    </div>
    <div class="form-group">
      <label class="form-label">Pays de résidence</label>
      <select class="form-input">
        <option>Côte d'Ivoire</option>
        <option>France</option>
        <option>Belgique</option>
        <option>Canada</option>
        <option>Autre</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">Mot de passe</label>
      <input class="form-input" type="password" placeholder="••••••••" />
    </div>
    <a class="btn-primary btn-full" href="subscribe-step2.html">
      Continuer <i class="fa-solid fa-arrow-right"></i>
    </a>
  </div>
</div>

<footer class="footer">

  <!-- Bas du footer -->
  <div class="footer-bottom">
    <div class="footer-bottom-inner">
      <span>© 2026 Kopro CI. Tous droits réservés.</span>
      <div class="footer-socials">
        <a href="#"><i class="fa-brands fa-linkedin"></i></a>
        <a href="#"><i class="fa-brands fa-instagram"></i></a>
        <a href="#"><i class="fa-brands fa-whatsapp"></i></a>
        <a href="#"><i class="fa-brands fa-x-twitter"></i></a>
      </div>
    </div>
  </div>

</footer>
</body>
</html>
